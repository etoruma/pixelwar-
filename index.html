<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PIXEL WARS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#090b14;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.11);--txt:#eef0ff;--dim:#8b90ad;--a:#7c5cff;--b:#19c6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(900px 520px at 15% -10%,#2b1c6e66,transparent),radial-gradient(760px 520px at 105% 110%,#0b5d7d55,transparent),var(--bg);
  color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;gap:8px;padding:10px 12px 8px;align-items:center}
.glass{background:var(--card);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#clan{flex:1;min-width:0;border-radius:16px;padding:7px 12px;display:flex;align-items:center;gap:10px;text-align:left}
#clan i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor}
#clan b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
#clan small{color:var(--dim);font-size:12px}
.hb{width:44px;height:44px;border-radius:14px;font-size:20px;flex:none}
.hb.on{border-color:var(--b);box-shadow:0 0 16px #19c6ff44}
#stage{flex:1;position:relative;overflow:hidden;margin:0 10px;border-radius:22px;border:1px solid var(--line);background:#0b0e1d;touch-action:none;box-shadow:inset 0 0 40px #0008}
#world{position:absolute;left:0;top:0;width:768px;height:768px;transform-origin:0 0}
#cv{width:768px;height:768px;display:block;image-rendering:pixelated}
#sel{position:absolute;width:8px;height:8px;display:none;pointer-events:none;box-shadow:0 0 0 1.5px #fff,0 0 14px 3px var(--b);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1.5px #fff,0 0 22px 6px var(--a)}}
.shl{position:absolute;border:1.5px dashed #19c6ff;background:rgba(25,198,255,.13);pointer-events:none;border-radius:2px}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:6px 12px;border-radius:99px;font-size:12px;color:var(--dim);pointer-events:none;white-space:nowrap}
#dock{padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
.pal{display:flex;gap:9px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.pal::-webkit-scrollbar{display:none}
.sw{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px #0006;transition:transform .12s}
.sw.on{border-color:#fff;transform:scale(1.14);box-shadow:0 0 14px #fff6,inset 0 0 0 2px #0006}
.row{display:flex;gap:8px}
.tool{height:52px;min-width:52px;padding:0 12px;border-radius:16px;font-weight:700;display:none}
.tool.show{display:block}.tool.on{border-color:var(--b);box-shadow:0 0 16px #19c6ff44}
#go{flex:1;height:52px;border:0;border-radius:16px;color:#fff;font-weight:800;font-size:17px;letter-spacing:.2px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 26px #7c5cff55}
#go:disabled{opacity:.5;box-shadow:none;filter:grayscale(.5)}
#go:active:not(:disabled){transform:scale(.98)}
#ov{position:fixed;inset:0;background:#0009;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:#12152a;border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:18px 16px calc(20px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.open{transform:none}
#sheet h2{margin:0 0 12px;font-size:20px}
.lb{position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;margin-bottom:6px;overflow:hidden;background:var(--card)}
.lb .bar{position:absolute;left:0;top:0;bottom:0;opacity:.22}
.lb>*{position:relative}.lb b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .rk{width:22px;color:var(--dim);font-weight:800}.lb i{width:10px;height:10px;border-radius:50%}
.lb.me{outline:1.5px solid var(--b)}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);margin-bottom:8px}
.item div{flex:1}.item small{display:block;color:var(--dim)}
.buy{border:0;border-radius:12px;padding:10px 14px;font-weight:800;color:#1a1300;background:linear-gradient(135deg,#ffd23f,#ff9f1c)}
.cta{width:100%;height:50px;border:0;border-radius:15px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));margin-top:8px}
.cta.alt{background:var(--card);border:1px solid var(--line)}
#ob{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;justify-content:center;padding:26px;background:radial-gradient(700px 500px at 50% 0,#3a23a0aa,transparent),#090b14f2;overflow:auto}
#ob h1{margin:0;font-size:38px;letter-spacing:-1px;line-height:1.02;background:linear-gradient(135deg,#fff,#8fe3ff 60%,#b49bff);-webkit-background-clip:text;background-clip:text;color:transparent}
#ob p{color:var(--dim);margin:10px 0 22px;font-size:16px}
input{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--txt);padding:0 14px;font:inherit;font-size:16px;outline:none;margin-top:8px}
input:focus{border-color:var(--b)}
.or{text-align:center;color:var(--dim);margin:14px 0 6px;font-size:13px}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-30px);opacity:0;background:#1d2140;border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:600;z-index:40;transition:.25s;max-width:88%;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
</style></head>
<body>
<div id="app">
  <header>
    <button id="clan" class="glass"><i></i><span style="min-width:0"><b>—</b><small>—</small></span></button>
    <button class="hb glass" id="bMode" title="Территории">🗺</button>
    <button class="hb glass" id="bTop">🏆</button>
    <button class="hb glass" id="bShop">🛒</button>
    <button class="hb glass" id="bInv">👥</button>
  </header>
  <div id="stage"><div id="world"><canvas id="cv" width="96" height="96"></canvas><div id="sel"></div></div><div id="hint" class="glass">Тап — выбрать пиксель · щипок — масштаб</div></div>
  <div id="dock">
    <div class="pal" id="pal"></div>
    <div class="row"><button class="tool glass" id="bBrush"></button><button class="tool glass" id="bShield"></button><button id="go">Поставить</button></div>
  </div>
</div>
<div id="ov"></div><div id="sheet"></div><div id="toast"></div>
<div id="ob">
  <h1>PIXEL<br>WARS</h1>
  <p>Один холст на всех. Создай клан, позови друзей и захвати территорию, пока другие не закрасили её.</p>
  <input id="obName" maxlength="20" placeholder="Название клана"><button class="cta" id="obCreate">⚔️ Создать клан</button>
  <div class="or">или вступить в готовый</div>
  <input id="obCode" maxlength="8" placeholder="Код клана" style="text-transform:uppercase"><button class="cta alt" id="obJoin">Вступить по коду</button>
</div>

<script>
(()=>{
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#090b14');tg.setBackgroundColor('#090b14');tg.disableVerticalSwipes()}catch(e){}}
const $=s=>document.querySelector(s);
const PAL=['#ffffff','#b8bdd0','#5b6078','#14151f','#ff4d6d','#ff8a3d','#ffd23f','#b8f25b','#2ee59d','#19c6ff','#3d7bff','#7c5cff','#d95bff','#ff6fb5','#8a5a3c','#f2c9a0'];
const PRGB=PAL.map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16))),EMPTY=[19,22,40];
function clanRGB(id){const h=(id*137.508)%360,s=.78,l=.58,a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return[f(0),f(8),f(4)]}
const dc=id=>'rgb('+clanRGB(id).join(',')+')';
const tap=t=>{try{tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}};
const note=t=>{try{tg.HapticFeedback.notificationOccurred(t)}catch(e){}};
let S=null,W=96,H=96,colors=new Uint8Array(W*H),owners=new Uint16Array(W*H),ver=-1,sel=null,col=5,mode='color',useBrush=false,cdEnd=0,v={x:0,y:0,k:1,min:1};
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'X-Init':(tg&&tg.initData)||'','Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Ошибка сети');return j}

/* ---------- холст ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d'),img=ctx.createImageData(W,H);
function draw(){const d=img.data;for(let i=0;i<W*H;i++){let c;if(mode==='color'){const k=colors[i];c=k?PRGB[k-1]:EMPTY}else{const o=owners[i];c=o?clanRGB(o):EMPTY}
  d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255}ctx.putImageData(img,0,0)}
function shields(){$('#world').querySelectorAll('.shl').forEach(e=>e.remove());(S.shields||[]).forEach(s=>{const e=document.createElement('div');e.className='shl';
  e.style.cssText=`left:${s[0]*8}px;top:${s[1]*8}px;width:${(s[2]-s[0]+1)*8}px;height:${(s[3]-s[1]+1)*8}px;border-color:${dc(s[4])};background:${dc(s[4]).replace('rgb','rgba').replace(')',',.14)')}`;$('#world').appendChild(e)})}
function place_sel(){const e=$('#sel');if(!sel){e.style.display='none';return}e.style.display='block';e.style.left=sel.x*8+'px';e.style.top=sel.y*8+'px'}
const st=$('#stage'),wd=$('#world');
function apply(){wd.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.k})`}
function fit(){const r=st.getBoundingClientRect();v.k=v.min=Math.min(r.width,r.height)/768;v.x=(r.width-768*v.k)/2;v.y=(r.height-768*v.k)/2;apply()}
const pts=new Map();let moved=0,pinch=null;
st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1)moved=0;
  if(pts.size===2){const [a,b]=[...pts.values()],r=st.getBoundingClientRect(),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:v.k,wx:(mx-v.x)/v.k,wy:(my-v.y)/v.k};moved=99}});
st.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(pts.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>8){v.x+=dx;v.y+=dy;apply()}}
  else if(pts.size===2&&pinch){const [a,b]=[...pts.values()],r=st.getBoundingClientRect(),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
    v.k=Math.max(v.min,Math.min(14,pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));v.x=mx-pinch.wx*v.k;v.y=my-pinch.wy*v.k;apply()}});
const up=e=>{const was=pts.size;pts.delete(e.pointerId);if(was===1&&moved<=8){const r=st.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-v.x)/v.k/8),y=Math.floor((e.clientY-r.top-v.y)/v.k/8);
  if(x>=0&&y>=0&&x<W&&y<H){sel={x,y};place_sel();tap();ui()}}if(pts.size<2)pinch=null};
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pinch=null});

/* ---------- интерфейс ---------- */
function buildPal(){$('#pal').innerHTML=PAL.map((c,i)=>`<button class="sw${i+1===col?' on':''}" data-c="${i+1}" style="background:${c}"></button>`).join('')}
$('#pal').addEventListener('click',e=>{const b=e.target.closest('.sw');if(!b)return;col=+b.dataset.c;tap();buildPal()});
const cdLeft=()=>Math.max(0,(cdEnd-Date.now())/1000);
function ui(){if(!S)return;const m=S.me;
  $('#ob').style.display=m.clan?'none':'flex';
  const c=$('#clan');c.querySelector('i').style.cssText=`background:${m.clan?dc(m.clan):'#555'};color:${m.clan?dc(m.clan):'#555'}`;
  c.querySelector('b').textContent=m.cname||'Без клана';c.querySelector('small').textContent=m.clan?`#${m.rank||'—'} место · ${m.score} px`:'вступите в клан';
  const br=$('#bBrush'),sh=$('#bShield');br.classList.toggle('show',m.brush>0);br.classList.toggle('on',useBrush&&m.brush>0);br.textContent='💣 '+m.brush;
  sh.classList.toggle('show',m.shield>0);sh.textContent='🛡 '+m.shield;
  $('#bMode').classList.toggle('on',mode==='clan');
  const go=$('#go'),left=cdLeft(),brush=useBrush&&m.brush>0;
  if(brush){go.textContent='💣 Залить 3×3';go.disabled=!sel}
  else if(left>0){go.textContent=m.skip>0?`⚡ Турбо (${m.skip})`:`⏳ ${Math.ceil(left)} с`;go.disabled=!sel||m.skip<1}
  else{go.textContent='Поставить';go.disabled=!sel}
  $('#hint').style.display=sel?'none':'block'}
setInterval(()=>{if(S)ui()},250);

async function load(force){try{const j=await api('state?v='+(force?-1:ver));S=j;if(j.c){colors=dec(j.c);owners=new Uint16Array(dec(j.o).buffer);}
  if(j.c||force){draw();shields()}else shields();ver=j.ver;cdEnd=Date.now()+j.cd*1000;ui()}catch(e){if(!S)toast(e.message)}}
async function put(){if(!sel||!S)return;const size=useBrush&&S.me.brush>0?3:1;
  try{await api('place',{x:sel.x,y:sel.y,c:col,size});if(size===1){const i=sel.y*W+sel.x;colors[i]=col;owners[i]=S.me.clan;draw()}tap('medium');note('success');await load(true)}
  catch(e){note('error');toast(e.message);load(true)}}
$('#go').onclick=put;
$('#bBrush').onclick=()=>{useBrush=!useBrush;tap();ui()};
$('#bShield').onclick=async()=>{if(!sel)return toast('Выберите точку — щит закроет область 11×11');try{await api('shield',{x:sel.x,y:sel.y});note('success');toast('🛡 Щит активен на 1 час');load(true)}catch(e){toast(e.message)}};
$('#bMode').onclick=()=>{mode=mode==='color'?'clan':'color';tap();draw();ui();toast(mode==='clan'?'Карта территорий кланов':'Обычные цвета')};

function sheet(html){$('#sheet').innerHTML=html;$('#ov').style.display='block';requestAnimationFrame(()=>$('#sheet').classList.add('open'))}
function closeSheet(){$('#sheet').classList.remove('open');setTimeout(()=>{$('#ov').style.display='none'},250)}
$('#ov').onclick=closeSheet;
function invite(){if(!S||!S.me.code)return;const link=`https://t.me/${S.bot}?start=clan_${S.me.code}`;
  const u='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('⚔️ Вступай в мой клан «'+S.me.cname+'» в PIXEL WARS — захватим холст вместе!');
  tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,'_blank')}
$('#bInv').onclick=()=>{if(!S||!S.me.clan)return;sheet(`<h2>👥 Позови в клан</h2><p style="color:var(--dim);margin:0 0 6px">Чем больше людей, тем быстрее вы закрашиваете холст. Код клана:</p>
  <div class="lb" style="font-size:24px;font-weight:800;letter-spacing:4px;justify-content:center">${esc(S.me.code)}</div><button class="cta" id="shr">Отправить приглашение</button>`);$('#shr').onclick=invite};
$('#clan').onclick=$('#bTop').onclick=()=>{if(!S)return;const max=Math.max(1,...S.top.map(t=>t.n));
  sheet('<h2>🏆 Рейтинг кланов</h2>'+(S.top.map((t,i)=>`<div class="lb${t.id===S.me.clan?' me':''}"><div class="bar" style="width:${t.n/max*100}%;background:${dc(t.id)}"></div><span class="rk">${i+1}</span><i style="background:${dc(t.id)}"></i><b>${esc(t.name)}</b><span>${t.n} px</span></div>`).join('')||'<p style="color:var(--dim)">Холст пока пуст — станьте первыми!</p>')+
  (S.me.clan?'<button class="cta" id="shr">👥 Пригласить друзей</button>':''));const b=$('#shr');if(b)b.onclick=invite};
$('#bShop').onclick=()=>{if(!S)return;sheet('<h2>🛒 Магазин</h2><p style="color:var(--dim);margin:0 0 12px">У вас: ⚡'+S.me.skip+' · 💣'+S.me.brush+' · 🛡'+S.me.shield+'</p>'+
  Object.entries(S.items).map(([k,i])=>`<div class="item"><div><b>${esc(i.title)}</b><small>${esc(i.desc)}</small></div><button class="buy" data-buy="${k}">⭐ ${i.stars}</button></div>`).join(''));
  $('#sheet').querySelectorAll('[data-buy]').forEach(b=>b.onclick=async()=>{try{const r=await api('invoice',{item:b.dataset.buy});
    if(tg&&tg.openInvoice)tg.openInvoice(r.link,s=>{if(s==='paid'){closeSheet();toast('Оплачено ✅');load(true)}});else window.open(r.link)}catch(e){toast(e.message)}})};
$('#obCreate').onclick=async()=>{try{await api('clan',{name:$('#obName').value});note('success');load(true)}catch(e){toast(e.message)}};
$('#obJoin').onclick=async()=>{try{await api('clan',{code:$('#obCode').value});note('success');load(true)}catch(e){toast(e.message)}};

buildPal();fit();addEventListener('resize',fit);draw();load(true);setInterval(()=>load(false),3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true)});
})();
</script></body></html>
